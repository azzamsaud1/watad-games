<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة الألعاب</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap" rel="stylesheet">
<style>:root{--ink:#17121b;--paper:#fff3cf;--card:#ffffff;--card2:#fff0bd;--text:#17121b;--muted:#6d5a63;--line:#17121b;--c1:#ef4057;--c2:#ff8a1f;--c3:#fbc52b;--c4:#2cc9d0;--c5:#0f7a99;--c6:#3b5bff;--c7:#1f9d74;--pri:var(--c3);--onpri:#17121b;--sh:4px 4px 0 var(--ink);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#07040a;--paper:#121c28;--card:#213042;--card2:#2c4056;--text:#fff6ea;--muted:#bfcad6;--line:#07040a}}
:root[data-theme="dark"]{--ink:#07040a;--paper:#121c28;--card:#213042;--card2:#2c4056;--text:#fff6ea;--muted:#bfcad6;--line:#07040a}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--text);font-family:Tahoma,Arial,sans-serif;padding:14px;min-height:100vh;background-image:radial-gradient(circle at 15% 8%,color-mix(in srgb,var(--c4) 22%,transparent) 0,transparent 38%),radial-gradient(circle at 90% 30%,color-mix(in srgb,var(--c1) 16%,transparent) 0,transparent 36%)}
.wrap{max-width:780px;margin:auto}
h1{font-size:1.7rem;margin:6px 0 4px;font-weight:900}h2{font-size:1.15rem;margin:0 0 10px;font-weight:900}
.muted{color:var(--muted);font-size:.92rem}
button{font:inherit;cursor:pointer;color:var(--text);background:var(--card);border:3px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:800;box-shadow:3px 3px 0 var(--line);transition:transform .08s,box-shadow .08s}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
button.g{background:var(--pri);color:var(--onpri)}
button.sm{padding:6px 11px;border-radius:11px;font-size:.9rem}
button:disabled{opacity:.5;cursor:default}
input,select{font:inherit;color:var(--text);background:var(--card);border:3px solid var(--line);border-radius:12px;padding:9px;min-width:0}
.card{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:14px;margin-bottom:14px;box-shadow:var(--sh)}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bar img{width:46px;height:46px;object-fit:contain}
.bar b{font-size:1.2rem;font-weight:900}
.bar .sp,.top .sp{flex:1}
.hero{background:var(--pri);color:var(--onpri);border:3px solid var(--line);border-radius:26px;box-shadow:var(--sh);padding:16px;text-align:center;margin-bottom:14px;position:relative;overflow:hidden}
.hero img{width:150px;height:auto;display:block;margin:0 auto 4px;animation:bob 3s ease-in-out infinite}
.hero .em{font-size:3.4rem;display:block;animation:bob 3s ease-in-out infinite}
.hero h1{margin:4px 0}
.hero p{margin:0;font-weight:700}
@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.chips button{border-radius:30px;padding:6px 14px;font-size:.92rem}
.chips button.on{background:var(--text);color:var(--card)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.cat{text-align:center;padding:14px 8px;border:3px solid var(--line);border-radius:20px;background:var(--k);color:var(--on);cursor:pointer;font:inherit;box-shadow:var(--sh)}
.cat:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}
.cat .em{display:block;font-size:2.3rem;line-height:1.15}
.cat b{display:block;font-size:1rem;margin-top:4px}
.cat small{display:block;opacity:.92;margin-top:4px;font-weight:600}
.tag{display:inline-block;background:rgba(255,255,255,.55);color:#17121b;border-radius:20px;padding:1px 9px;font-size:.72rem;margin:3px 2px 0;font-weight:800}
.stats{display:flex;gap:10px;margin:14px 0}
.stats div{flex:1;text-align:center;background:var(--card);border:3px solid var(--line);border-radius:16px;padding:10px 4px;box-shadow:3px 3px 0 var(--line)}
.stats b{display:block;font-size:1.5rem;color:var(--c1)}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.step{display:flex;align-items:center;gap:10px;margin:8px 0}
.step b{min-width:34px;text-align:center;font-size:1.5rem;color:var(--c1)}
.trow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.dot{width:18px;height:18px;border-radius:50%;flex:none;border:2px solid var(--line)}
.trow input{flex:1}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:3px solid var(--line);border-radius:16px;margin-bottom:10px;min-height:60px;overflow:hidden;position:relative;box-shadow:3px 3px 0 var(--line)}
.rk{width:36px;height:36px;border-radius:50%;background:var(--c);color:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:900;flex:none;margin-inline-start:10px}
.nm{flex:1;padding:8px 0}.nm b{display:block;font-size:1.15rem}.nm small{color:var(--muted)}
.cover{position:absolute;inset:0;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.05rem;cursor:pointer;border:0;border-radius:0;width:100%;box-shadow:none;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.item.open .cover{display:none}
.ask{margin-inline-end:10px}
.ov{position:fixed;inset:0;background:rgba(15,5,25,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--paper);border-radius:24px 24px 0 0;width:100%;max-width:580px;max-height:90vh;overflow:auto;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px));border:3px solid var(--line);border-bottom:0}
.sc{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);border-radius:16px;padding:10px;margin-bottom:9px;border:3px solid var(--line);border-inline-start:12px solid var(--c)}
.sc .n{flex:1;min-width:110px;font-weight:800}
.sc .v{font-size:1.6rem;font-weight:900;color:var(--c1);min-width:44px;text-align:center}
.qb{display:flex;gap:4px;flex-wrap:wrap;width:100%}
.qb button{flex:1;padding:8px 4px;min-width:44px}
.cu{display:flex;gap:6px;width:100%}.cu input{flex:1;width:70px}
.win{text-align:center;border:3px solid var(--line);border-radius:22px;padding:20px;background:var(--c3);color:#17121b;margin-bottom:12px;box-shadow:var(--sh)}
.win b{font-size:2.1rem;display:block;margin:6px 0}.win span{font-size:1.2rem;font-weight:800}
.fabs{position:fixed;inset-inline-start:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;gap:8px}
.bzb.live{background:var(--c1);color:#fff;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.pill{display:inline-block;font-size:.78rem;font-weight:800;border:2px solid var(--line);border-radius:20px;padding:2px 9px;background:var(--card2)}
.pill.ok{background:var(--c4);color:#17121b}
.peek{display:block;color:var(--c1);font-weight:800}
.peekbox{margin-top:10px;border:3px dashed var(--c1);border-radius:14px;padding:8px 10px;font-size:.95rem}
.bzstrip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:3px solid var(--line);border-radius:14px;padding:8px 10px;margin:0 0 12px;background:var(--card);box-shadow:3px 3px 0 var(--line);font-weight:700}
.bzstrip.live{background:var(--c3);color:#17121b}
.buzz{display:flex;flex-direction:column;align-items:center;justify-content:center;width:min(78vw,300px);height:min(78vw,300px);margin:18px auto;border-radius:50%;border:5px solid var(--line);background:var(--c1);color:#fff;font-size:5rem;box-shadow:0 10px 0 var(--line);cursor:pointer;font-weight:900}
.buzz small{font-size:1.4rem;margin-top:4px}
.buzz:active{transform:translateY(8px);box-shadow:0 2px 0 var(--line)}
.buzz.off{background:var(--card2);color:var(--muted);box-shadow:none;font-size:3.5rem;cursor:default}
.buzz.done{background:var(--c4);color:#17121b;cursor:default}
.word{font-size:2.3rem;font-weight:900;text-align:center;margin:10px 0 6px;color:var(--c1)}
.chip{display:inline-block;background:var(--c4);color:#17121b;margin:2px;border:2px solid var(--line);border-radius:20px;padding:2px 12px;font-size:.88rem;font-weight:800}
.rain{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.rain i{position:absolute;top:-40px;font-style:normal;font-size:1.6rem;animation:fall 3.6s linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.rain,.hero img,.hero .em{animation:none}}
.opt{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.opt .n{flex:1;font-weight:800}
.hexsvg{display:block;width:100%;height:auto;margin:6px 0}
.hexsvg g{cursor:pointer}
.tl{font-size:1.6rem;font-weight:900;text-align:center;color:var(--c1)}
.fdrow{display:flex;align-items:center;gap:10px;border:3px solid var(--line);border-radius:14px;margin-bottom:8px;min-height:54px;position:relative;overflow:hidden;background:var(--card);box-shadow:3px 3px 0 var(--line)}
.fdrow .no{width:34px;height:34px;border-radius:50%;background:var(--c4);color:#17121b;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:900;margin-inline-start:10px;flex:none}
.fdrow .a{flex:1;font-weight:800;font-size:1.1rem}
.fdrow .p{background:var(--c3);color:#17121b;font-weight:900;padding:6px 12px;margin-inline-end:8px;border-radius:10px;border:2px solid var(--line)}
.fdrow .cv{position:absolute;inset:0;background:var(--c2);color:#17121b;border:0;border-radius:0;box-shadow:none;width:100%;font-size:1.1rem}
.fdrow.open .cv{display:none}
.x{font-size:2.4rem;text-align:center;letter-spacing:6px;min-height:46px}
.sjteams{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.sjteam{background:var(--card);border:3px solid var(--line);border-top:10px solid var(--c);border-radius:16px;padding:10px;box-shadow:3px 3px 0 var(--line)}
.sjteam.turn{outline:4px solid var(--c);outline-offset:2px}
.sjsc{font-size:1.7rem;font-weight:900;color:var(--c1)}
.helps{display:flex;flex-direction:column;gap:5px;margin:6px 0 4px}
.helps .hp{font-size:.82rem;padding:5px 8px;text-align:start}
.helps .hp.used{text-decoration:line-through;opacity:.45}
.sjboard{display:grid;gap:10px}
.sjcol{border:3px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card);box-shadow:3px 3px 0 var(--line)}
.sjhead{padding:8px 4px;text-align:center;font-weight:900;border-bottom:3px solid var(--line);font-size:.95rem}
.sjcells{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px}
.sjcell{padding:10px 2px;font-size:1.05rem;border-radius:10px;box-shadow:2px 2px 0 var(--line)}
.sjcell.done{background:var(--card2);box-shadow:none;opacity:.7}
.tl.hot{color:#e11d48}
@media (max-width:520px){.sjboard{grid-template-columns:repeat(2,1fr)!important}}
html.tvh{font-size:21px}
.tv.wrap{max-width:1250px}
.tv button:not(.cover):not(.cv):not(.sjcell):not(.cat):not(.tvx):not(.kopt):not(.kos){display:none!important}
.tv .kopt,.tv .kos{pointer-events:none}
.tv .cat,.tv .sjcell,.tv .cover,.tv .cv,.tv .hexsvg g{pointer-events:none}
.tv .peekbox,.tv select,.tv input,.tv label,.tv .chips,.tv .top{display:none!important}
.tv .ov{background:rgba(15,5,25,.45);align-items:center}
.tv .sheet{border-radius:24px;border-bottom:3px solid var(--line);max-width:900px}
.tvx{position:fixed;top:8px;inset-inline-end:8px;z-index:30;opacity:.35}
.tvx:hover{opacity:1}
.tvbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.tvbar div{flex:1;min-width:140px;background:var(--card);border:3px solid var(--line);border-top:10px solid var(--c);border-radius:16px;padding:8px 12px;display:flex;align-items:center;gap:8px;box-shadow:3px 3px 0 var(--line)}
.tvbar span{flex:1;font-weight:800}
.tvbar b{font-size:1.8rem;color:var(--c1)}
.hexsvg.prev{max-width:300px;margin:8px auto}
.lbtop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.lbtop b{font-size:1.2rem}
.lbgrid{display:grid;gap:12px;height:calc(100vh - 140px);min-height:320px}
.lbgrid.lb2{grid-template-columns:1fr 1fr}
.lbgrid.lb3{grid-template-columns:1fr 1fr 1fr}
.lbgrid.lb4,.lbgrid.lb5,.lbgrid.lb6{grid-template-columns:1fr 1fr}
.lbgrid.lb7,.lbgrid.lb8{grid-template-columns:1fr 1fr 1fr}
@media (max-width:520px){.lbgrid.lb3{grid-template-columns:1fr}}
.lbbtn{background:var(--c);color:#17121b;border:5px solid var(--line);border-radius:24px;font-size:1.6rem;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 8px 0 var(--line);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.lbbtn:active{transform:translateY(6px);box-shadow:0 2px 0 var(--line)}
.lbbtn small{font-size:1rem;opacity:.75}
.lbwin{text-align:center;background:var(--c);color:#17121b;border:5px solid var(--line);border-radius:28px;padding:40px 16px;min-height:calc(100vh - 140px);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:var(--sh);animation:pop .35s ease-out}
.lbwin small{font-size:1.3rem;font-weight:800}
.lbwin b{font-size:clamp(2.4rem,9vw,5rem);margin:10px 0 20px}
.lbact{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.lbact button{font-size:1.1rem;padding:12px 18px}
@keyframes pop{0%{transform:scale(.85)}70%{transform:scale(1.04)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.lbwin{animation:none}}
.qr{width:190px;margin:8px auto;background:#fff;border:3px solid var(--line);border-radius:12px;padding:4px}
.qr svg{width:100%;height:auto;display:block}
.lnk{font-size:.8rem;word-break:break-all;background:var(--card2);border-radius:10px;padding:6px 8px;margin:6px 0 10px;text-align:left}
.cat .art{display:block;border:3px solid var(--line,#17121b);border-radius:14px;background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.75),rgba(255,255,255,.25) 70%),var(--k);margin:-2px -2px 10px;overflow:hidden;box-shadow:inset 0 -6px 0 rgba(0,0,0,.08)}
.cat .art svg{display:block;width:100%;height:auto;transition:transform .25s}
@media (hover:hover){.cat:hover .art svg{transform:scale(1.05) rotate(-1deg)}}
.cat .em .ic{width:54px;height:54px;display:block;margin:0 auto 2px;filter:drop-shadow(2px 3px 0 rgba(0,0,0,.18))}
.ic{display:inline-block;vertical-align:middle}
.ic.sm{width:26px;height:26px;margin-inline-end:6px}
.ic.hd{width:34px;height:34px;display:block;margin:0 auto 4px;background:#fff;border:2px solid #17121b;border-radius:50%;padding:3px}
.sjc{display:inline-flex;align-items:center}
.sjc[disabled]{opacity:.45;cursor:not-allowed}
.tv .ic.hd{width:52px;height:52px}
.ic.hero{width:96px;height:96px}.ic.bari{width:40px;height:40px}
.chip.gold{background:linear-gradient(90deg,#ffe58a,#f4b23b);color:#17121b;box-shadow:0 0 0 2px #17121b}
.edb{padding:2px 8px!important;margin-inline-start:6px}
.ic.emb{width:30px;height:30px;margin-inline-end:6px;flex:none}
.ic.emb.lg{width:64px;height:64px;display:block;margin:6px auto}
.ic.emb.xl{width:90px;height:90px;display:block;margin:0 auto 6px}
.embb{padding:3px!important;border-radius:12px!important;background:var(--c)!important;line-height:0}
.embb .ic.emb{margin:0;width:36px;height:36px}
.trow{align-items:center}
.pickb{display:flex;align-items:center;justify-content:center;gap:8px}
.tvbar span{display:inline-flex;align-items:center}
.tvbar .ic.emb{width:24px;height:24px}
.clues{display:grid;gap:8px;margin:12px 0;text-align:start}
.clue{display:flex;gap:10px;align-items:center;border:3px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper);font-weight:800;color:var(--muted,#777)}
.clue.open{background:var(--card);color:var(--text);box-shadow:3px 3px 0 var(--line)}
.clue .cn{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--c3);border:2px solid var(--line);color:#17121b;font-weight:900}
.lkgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.lkw{border:3px solid var(--line);border-radius:14px;padding:18px 8px;font-size:1.3rem;font-weight:900;background:var(--paper);color:var(--muted,#888)}
.lkw.open{background:var(--k);color:var(--on);box-shadow:4px 4px 0 var(--line)}
.tfans{font-size:2rem;font-weight:900;border:3px solid var(--line);border-radius:14px;padding:10px;margin:10px 0;color:#fff}
.tfans.y{background:#12b886}.tfans.n{background:#ef4057}
.tfbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.tfbtns button{font-size:3rem;padding:22px 8px;border-radius:22px;color:#fff;display:flex;flex-direction:column;align-items:center}
.tfbtns small{font-size:1.2rem;font-weight:900}
.tfbtns .tfy{background:#12b886}.tfbtns .tfn{background:#ef4057}
.tfbtns button.on{outline:6px solid var(--c3);transform:scale(1.03)}
.ctnum{font-size:3.6rem;font-weight:900;line-height:1.1;margin:6px 0}
.ctnum.ok{color:#12b886}
.lobby .hero{margin-top:6px}
.lobbyqr{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap;background:var(--card);border:3px solid var(--line);border-radius:20px;padding:14px;box-shadow:5px 5px 0 var(--line);margin-bottom:14px;text-align:center}
.lobbyqr .qr{width:220px;max-width:60vw}
.lteams{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.lteam{border:3px solid var(--line);border-radius:18px;background:var(--c);color:#17121b;padding:14px;text-align:center;box-shadow:5px 5px 0 var(--line);display:flex;flex-direction:column;align-items:center;animation:bob 3s ease-in-out infinite}
.lteam:nth-child(2n){animation-delay:.6s}.lteam b{font-size:1.25rem}
.tour{width:100%;border-collapse:collapse;font-size:.95rem}
.tour th,.tour td{border-bottom:2px solid var(--line);padding:6px;text-align:center;white-space:nowrap}
.tour td:first-child,.tour th:first-child{text-align:start}
.resimg{width:100%;border:3px solid var(--line);border-radius:14px;display:block;margin:8px 0}
a.btn{display:inline-flex;align-items:center;justify-content:center;border:3px solid var(--line);border-radius:14px;padding:10px;font-weight:800;background:var(--card);color:var(--text);text-decoration:none;box-shadow:3px 3px 0 var(--line)}
.tv .clue{font-size:1.4rem}.tv .lkw{font-size:2rem}.tv .ctnum{font-size:5rem}
@media (prefers-reduced-motion:reduce){.lteam{animation:none}}
/* توازن بطاقات الألعاب */
.ggrid{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.ggrid>.cat{flex:0 1 calc(50% - 6px);min-width:0;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start}
@media (min-width:700px){.ggrid>.cat{flex-basis:calc(33.333% - 8px)}}
.ggrid>.cat .art{aspect-ratio:16/9;flex:none}
.ggrid>.cat .art svg{width:100%;height:100%}
.ggrid>.cat b{min-height:1.4em;display:flex;align-items:center;justify-content:center;line-height:1.3}
.ggrid>.cat small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em;line-height:1.3}
.ggrid>.cat>div{margin-top:auto;padding-top:6px}
.sjteams{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.fdgive{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.fdgive button{display:flex;align-items:center;justify-content:center;gap:4px;padding:12px}
.ca{display:inline-block;line-height:0;vertical-align:middle;flex:none}
.ca svg{width:100%;height:100%;display:block}
.ca.sm{width:34px;height:34px;margin-inline-end:7px}
.ca.hd{width:52px;height:52px;display:block;margin:0 auto 4px;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.25))}
.tv .ca.hd{width:72px;height:72px}
.sjc{padding-block:5px!important}
.ihl{font-size:4rem;font-weight:900;line-height:1.1;color:var(--c1)}

var TMDEF={qcomplete:30,qsurah:30,qaround:30,rank:60,where:30,hex:20,feud:45,whoami:30,link:30,num:30,proverb:20};
var TMOPT=[0,5,10,15,20,30,45,60,90,120,180,300,600];
function tmStep(t,d){var st=t<60?5:t<180?15:30;if(d<0&&t<=60&&t>5)st=5;if(d<0&&t>60&&t<=180)st=15;var n=t+d*st;if(!t&&d>0)n=5;return Math.max(5,Math.min(600,n));}

function tmGet(g){var o=tmOwn(g);if(o)return o[0][o[1]]||0;G.tmx=G.tmx||{};return G.tmx[g]!=null?G.tmx[g]:(TMDEF[g]||0);}

function genKey(){var v=G.v,x;
 if(v==="q"){var op=(G.open[G.cat]||[]).length,n=CATS[G.cat]?CATS[G.cat].i.length:0;return op<n?"q:"+G.cat:"";}
 if(v==="hx"){x=G.hx;return x.q&&!x.rev?"hx:"+x.q:"";}
 if(v==="wh"){x=G.wh;return x.cur>=0&&!x.rev?"wh:"+x.cur:"";}
 if(v==="fd"){x=G.fd;var q=FEUD[x.cur];if(!q)return "";var all=q[1].every(function(_,i){return x.rev[i];});return all||x.strikes>=3?"":"fd:"+x.cur;}
 if(v==="wm"){x=G.wm;return x.cur>=0&&!x.rev?"wm:"+x.cur+":"+x.k:"";}
 if(v==="lk"){x=G.lk;return x.cur>=0&&!x.rev?"lk:"+x.cur+":"+x.k:"";}

 if(v==="pv"){x=G.pv;return x.cur>=0&&!x.rev?"pv:"+x.cur:"";}
 if(v==="qc"||v==="qs"||v==="qa"){x=G.qr;return x.cur&&x.kind===v&&!x.rev?v+":"+x.cur.join(":")+":"+(v==="qc"?0:x.k||0):"";}
 return "";}

 if(!o){G.tmat=now;G.tmk=genKey();return;}
 if(g==="sj"){if(G.sj.cur)G.sj.qAt=now;}else if(g==="tf")G.tf.qAt=now;else if(g==="count")G.ct.qAt=now;else if(g==="ihj")G.ih.qAt=now;else if(g==="taboo")G.tb.qAt=now;else if(g==="blitz")G.bl.qAt=now;}

function qFeat(q){q=String(q||"");var ws=q.trim().split(/\s+/),w=ws[0]||"";var ks=QKW.filter(function(k){return q.indexOf(k)>=0;});return {w:w,w2:ws.slice(0,2).join(" "),k:ks};}
function optsFor(id){var r=Q(id);if(!r)return {o:[],c:0};var F0=qFeat(r[1]);var ans=String(r[2]).trim(),k0=nkey(ans),len=ans.length,wc=ans.split(/\s+/).length,num=/^[\d٠-٩]/.test(ans),al=/^ال/.test(ans),seen={};seen[k0]=1;
